<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة تحليل الأداء والمشروعات الحية | المقاولون العرب</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600;700;800&family=Outfit:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Flag Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        body, html {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #080D1A;
            touch-action: none;
            position: fixed;
            width: 100%;
            inset: 0;
        }

        .map-page-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .map-page-header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 104px;
            min-height: 104px;
            flex: 0 0 104px;
            padding: 0 24px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            gap: 20px;
            direction: rtl;
            box-sizing: border-box;
        }

        /* Ultra Minimalist Header Stats (Top-Right) */
        .header-side-right {
            display: flex;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-summary-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .header-last-update {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
            font: 600 10px/1.2 Tajawal, sans-serif;
            white-space: nowrap;
            margin-top: 2px;
        }

        .header-last-update time {
            color: #cbd5e1;
            font-family: Outfit, Tajawal, sans-serif;
            font-weight: 700;
        }

        .minimal-stats-group {
            display: flex;
            align-items: center;
            gap: 26px;
            direction: rtl;
            user-select: none;
        }

        .minimal-stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .minimal-stat-title {
            font: 900 21px/1.15 Tajawal, sans-serif;
            color: #ffffff;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .minimal-stat-value {
            display: flex;
            align-items: baseline;
            gap: 3px;
            direction: ltr;
            font-family: Outfit, sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .stat-plus {
            font-size: 14px;
            font-weight: 800;
            color: #10b981;
        }

        .stat-number {
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            color: #cbd5e1;
            letter-spacing: 0.02em;
        }

        .minimal-stat-divider {
            width: 1px;
            height: 38px;
            background: rgba(255, 255, 255, 0.14);
        }

        /* Light Theme Overrides */
        [data-theme="aegov"] .minimal-stat-title {
            color: #0f172a;
            text-shadow: none;
        }
        [data-theme="aegov"] .stat-number {
            color: #475569;
        }
        [data-theme="aegov"] .header-last-update,
        [data-theme="aegov"] .header-last-update time {
            color: #64748b;
        }
        [data-theme="aegov"] .minimal-stat-divider {
            background: rgba(15, 23, 42, 0.15);
        }

        .map-header-logo-center {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-shrink: 0;
            padding: 0 16px;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            pointer-events: auto;
        }

        .map-header-logo-center img {
            height: 100px;
            max-height: 96%;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
            transition: transform 0.2s ease;
            pointer-events: auto;
            background: transparent !important;
        }

        .map-header-logo-center img:hover {
            transform: scale(1.03);
        }

        /* Light Theme Overrides for Logo */
        [data-theme="aegov"] .map-header-logo-center {
            background: transparent !important;
            box-shadow: none !important;
        }

        [data-theme="aegov"] .map-header-logo-center img {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08)) !important;
            background: transparent !important;
        }

        .map-page-canvas-wrapper {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            height: auto;
            min-height: 0;
            overflow: hidden;
        }

        #standalone-executive-map {
            width: 100%;
            height: 100%;
            background: #0B132B;
        }

        /* Natural Atlas-Grade Typography (English World Map Labels) */
        .arabic-map-label {
            background: transparent !important;
            border: none !important;
            pointer-events: none !important;
        }

        .map-label-country {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #94a3b8;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
            white-space: nowrap;
            text-align: center;
            user-select: none;
            opacity: 0.88;
            display: inline-block;
        }
        [data-theme="aegov"] .map-label-country {
            color: #334155;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .map-label-water {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-style: italic;
            font-weight: 600;
            font-size: 10.5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #38bdf8;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
            white-space: nowrap;
            text-align: center;
            user-select: none;
            opacity: 0.75;
            display: inline-block;
        }
        [data-theme="aegov"] .map-label-water {
            color: #0284c7;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .map-label-city {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 600;
            font-size: 9.5px;
            color: #cbd5e1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
            white-space: nowrap;
            user-select: none;
            opacity: 0.7;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .map-city-bullet {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 3px #f59e0b;
            display: inline-block;
        }
        [data-theme="aegov"] .map-label-city {
            color: #334155;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95);
        }
        [data-theme="aegov"] .map-city-bullet {
            background: #2563eb;
            box-shadow: 0 0 4px rgba(37, 99, 235, 0.5);
        }

        .country-active-feature {
            cursor: pointer;
            transition: stroke 0.25s ease, fill 0.25s ease;
        }

        .country-inactive-feature {
            cursor: default !important;
            pointer-events: auto;
        }

        /* Marker Precision Fix - Exact Geo Anchor Centering */
        .custom-branch-marker, .custom-project-marker {
            background: transparent !important;
            border: none !important;
        }
        .branch-beacon-container {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0;
            padding: 0;
            transform: none !important;
        }
        .branch-beacon-glow-outer {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, rgba(37, 99, 235, 0.06) 65%, transparent 100%);
            pointer-events: none;
            animation: branchPulse 2.6s infinite ease-in-out;
        }
        .branch-3d-building {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 5px rgba(56, 189, 248, 0.5));
        }
        .branch-3d-svg {
            width: 28px;
            height: 28px;
            display: block;
            overflow: visible;
        }
        .branch-beacon-container:hover .branch-3d-building {
            transform: translateY(-3px) scale(1.25);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 12px rgba(56, 189, 248, 0.95));
        }
        .project-beacon-container {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0;
            padding: 0;
            transform: none !important;
        }

        .back-dashboard-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .back-dashboard-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--theme-accent);
            color: var(--theme-accent);
        }

        .header-side-left {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            flex: 1;
            min-width: 0;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* ==================================================== */
        /* Stock Market Live Project Ticker Tape (Clean Flow)   */
        /* ==================================================== */
        .code-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
        }

        .header-stock-ticker {
            position: relative;
            flex: 1;
            min-width: 0;
            max-width: 100%;
            height: 84px;
            overflow-x: scroll;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
            display: flex;
            align-items: center;
            user-select: none;
            direction: ltr;
            cursor: grab;
        }

        .header-stock-ticker::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .header-stock-ticker:active {
            cursor: grabbing;
        }

        .stock-ticker-track {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            width: max-content;
            will-change: scroll-position;
        }

        .stock-ticker-item {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 1.5px;
            padding: 2px 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            cursor: pointer;
            direction: rtl;
            text-align: right;
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            flex-shrink: 0;
        }

        .stock-ticker-item:hover {
            opacity: 0.75;
            transform: translateY(-1px);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .stock-ticker-separator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.22);
            font-size: 14px;
            margin: 0 4px;
            user-select: none;
            flex-shrink: 0;
        }

        .ticker-row-title {
            display: flex;
            align-items: center;
            width: 100%;
            direction: rtl;
            line-height: 1.3;
            margin-bottom: 1px;
        }

        .ticker-proj-title {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 0.01em;
            line-height: 1.25;
        }

        .ticker-row-metric {
            display: flex;
            align-items: baseline;
            gap: 5px;
            font-size: 10.5px;
            font-weight: 700;
            direction: rtl;
            font-family: 'Tajawal', 'Outfit', sans-serif;
            line-height: 1.2;
        }

        .ticker-metric-label {
            color: #94a3b8;
            font-size: 10.5px;
        }

        .ticker-metric-val {
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .ticker-metric-val.profit {
            color: #10b981;
        }

        .ticker-metric-val.loss {
            color: #ef4444;
        }

        .ticker-metric-val.neutral {
            color: #cbd5e1;
        }

        .ticker-metric-val.prog {
            color: #f1f5f9;
        }

        .ticker-metric-val.elapsed {
            color: #38bdf8;
        }

        .ticker-delta-val {
            font-size: 10px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .ticker-delta-val.up {
            color: #34d399;
        }

        .ticker-delta-val.down {
            color: #f87171;
        }

        .ticker-delta-val.neutral {
            color: #94a3b8;
        }

        /* Light Theme Overrides for Ticker */
        [data-theme="aegov"] .stock-ticker-item {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        [data-theme="aegov"] .stock-ticker-item:hover {
            opacity: 0.75 !important;
        }

        [data-theme="aegov"] .ticker-proj-title {
            color: #0f172a !important;
            font-weight: 900 !important;
        }

        [data-theme="aegov"] .ticker-metric-label {
            color: #64748b !important;
            font-weight: 800 !important;
        }

        [data-theme="aegov"] .ticker-metric-val.prog {
            color: #334155 !important;
            font-weight: 800 !important;
        }

        [data-theme="aegov"] .ticker-metric-val.elapsed {
            color: #0284c7 !important;
            font-weight: 800 !important;
        }

        [data-theme="aegov"] .ticker-metric-val.profit,
        [data-theme="aegov"] .ticker-delta-val.up {
            color: #059669 !important;
        }

        [data-theme="aegov"] .ticker-metric-val.loss,
        [data-theme="aegov"] .ticker-delta-val.down {
            color: #dc2626 !important;
        }

        [data-theme="aegov"] .ticker-metric-val.neutral,
        [data-theme="aegov"] .ticker-delta-val.neutral {
            color: #64748b !important;
        }

        [data-theme="aegov"] .stock-ticker-separator {
            color: #94a3b8 !important;
        }

        html[data-theme="aegov"] body { background:#eef2f7; }
        html[data-theme="aegov"] .map-page-header { background:rgba(255,255,255,.96); border-bottom-color:rgba(197,155,39,.38); box-shadow:0 4px 20px rgba(15,23,42,.12); }
        html[data-theme="aegov"] #standalone-executive-map { background:#e2e8f0; }
        .header-brand-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .mobile-only-update {
            display: none;
        }

        @media(max-width:1024px){
            .map-page-header {
                height: 88px;
                min-height: 88px;
                flex: 0 0 88px;
                padding: 0 14px;
                gap: 12px;
                justify-content: flex-start;
            }
            .map-page-canvas-wrapper {
                flex: 1 1 auto;
                height: auto;
            }
            /* 1. Hide stats block (red box) completely on mobile & tablet */
            .header-side-right {
                display: none !important;
            }
            /* 2. Logo moves to the start (right side in RTL) */
            .map-header-logo-center {
                order: 1;
                padding: 0 4px;
            }
            .header-brand-block {
                align-items: flex-start;
                gap: 2px;
            }
            .map-header-logo-center img {
                height: 48px;
                max-height: 48px;
            }
            /* 3. Show last update date under logo on mobile/tablet */
            .mobile-only-update {
                display: flex;
                margin-top: 0;
                font-size: 9px;
                gap: 3px;
                color: #94a3b8;
                white-space: nowrap;
                line-height: 1;
            }
            .mobile-only-update time {
                color: #cbd5e1;
                font-size: 9px;
                font-weight: 700;
            }
            /* 4. Ticker takes all the rest of the available space */
            .header-side-left {
                order: 2;
                flex: 1;
                width: 0;
                min-width: 0;
                margin-inline-start: 10px;
                height: 100%;
            }
            .header-stock-ticker {
                height: 82px;
            }
        }
        @media(max-width:600px){
            .map-page-header {
                height: 86px;
                min-height: 86px;
                flex: 0 0 86px;
                padding: 0 8px;
                gap: 8px;
            }
            .map-header-logo-center img {
                height: 44px;
                max-height: 44px;
            }
            .mobile-only-update {
                font-size: 8px;
            }
            .mobile-only-update time {
                font-size: 8px;
            }
            .header-side-left {
                margin-inline-start: 4px;
                height: 100%;
            }
            .header-stock-ticker {
                height: 80px;
            }
        }

        .board-briefing {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 700;
            width: min(390px, calc(100vw - 36px));
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-top: 3px solid #d8b05a;
            background: rgba(8, 17, 31, 0.94);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(16px);
        }

        .board-briefing-eyebrow { color: #d8b05a; font: 800 11px/1 Outfit, sans-serif; letter-spacing: .16em; }
        .board-briefing h1 { margin: 8px 0 4px; font: 900 23px/1.25 Tajawal, sans-serif; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .board-briefing-subtitle { margin: 0; color: #cbd5e1; font-size: 11.5px; font-weight: 600; }
        .board-primary-number { margin: 18px 0 14px; color: #fff4cf; font: 900 32px/1 Outfit, sans-serif; letter-spacing: -.03em; }
        .board-primary-number span { display: block; margin-top: 5px; color: #94a3b8; font: 700 12px/1.2 Tajawal, sans-serif; letter-spacing: 0; }
        .board-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.14); }
        .board-stat { padding: 12px 8px; border-left: 1px solid rgba(255,255,255,.14); }
        .board-stat:first-child { border-left: 0; }
        .board-stat-label { display:block; color:#94a3b8; font-size:11px; font-weight:700; }
        .board-stat-value { display:block; margin-top:5px; color:#edf1f7; font:800 16px/1 Outfit, sans-serif; }
        .board-stat:first-child .board-stat-value { color:#fff4cf; font-size:22px; font-weight:900; letter-spacing:-.035em; }
        .board-composition { display:grid; grid-template-columns: 172px 1fr; align-items:center; gap:16px; margin-top:16px; border-top:1px solid rgba(255,255,255,.14); padding-top:16px; }
        .board-donut-wrap { position:relative; height:168px; }
        .board-donut-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:#f7e5ae; font:900 19px Outfit,sans-serif; }
        .board-composition-list { display:flex; flex-direction:column; gap:8px; }
        .board-composition-item { display:flex; justify-content:space-between; align-items:center; color:#cbd5e1; font-size:11px; font-weight:700; }
        .board-composition-item b { color:#edf1f7; font:800 12px Outfit,sans-serif; }
        .board-composition-key { display:flex; align-items:center; gap:6px; font-weight:700; }
        .board-composition-key i { width:8px; height:8px; border-radius:50%; display:inline-block; }
        #country-drawer-overlay { justify-content:center; align-items:center; padding:14px; }
        #country-drawer.board-country-dialog { width:min(1320px, 97vw); max-width:none; height:min(1040px, 97vh); overflow:hidden; border:1px solid rgba(216,176,90,.35); border-top:3px solid #d8b05a; transform:translateY(18px) scale(.98); }
        #country-drawer-overlay.show #country-drawer.board-country-dialog { transform:translateY(0) scale(1); }
        .country-board-head { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:22px 26px; border-bottom:1px solid rgba(255,255,255,.14); }
        .country-board-eyebrow { color:#d8b05a; font:800 13px Outfit,sans-serif; letter-spacing:.15em; }
        .country-board-title { display:flex; align-items:baseline; gap:10px; margin:7px 0 0; color:#fff; font:900 32px Tajawal,sans-serif; }
        .country-board-title-separator { color:#d8b05a; opacity:.75; font-weight:700; font-size:24px; margin:0 2px; }
        .country-board-project-count { color:#94a3b8; font:800 13px Tajawal,sans-serif; white-space:nowrap; }

            <div class="fab-container" id="map-controls-container">
                <div class="fab-primary-column" id="fab-primary-menu" aria-label="أقسام التحكم بالخريطة" aria-hidden="true">
                    <button type="button" class="fab-menu-button fab-category" id="control-tab-map" data-control-tab="map" style="--fab-delay:40ms;--item-glow:#10B981" aria-label="إعدادات الخريطة" aria-expanded="false" aria-controls="control-panel-map" onclick="selectMapControlTab('map')"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span class="fab-button-label">الخريطة</span></button>
                    <button type="button" class="fab-menu-button fab-category" id="control-tab-ticker" data-control-tab="ticker" style="--fab-delay:90ms;--item-glow:#06B6D4" aria-label="إعدادات الشريط" aria-expanded="false" aria-controls="control-panel-ticker" onclick="selectMapControlTab('ticker')"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span class="fab-button-label">الشريط</span></button>
                    <button type="button" class="fab-menu-button fab-category" id="control-tab-settings" data-control-tab="settings" style="--fab-delay:140ms;--item-glow:#F59E0B" aria-label="إعدادات العرض" aria-expanded="false" aria-controls="control-panel-settings" onclick="selectMapControlTab('settings')"><i class="fa-solid fa-gear" aria-hidden="true"></i><span class="fab-button-label">الإعدادات</span></button>
                </div>

                <div class="fab-submenu" id="control-panel-map" data-control-panel="map" aria-label="عناصر تحكم الخريطة" aria-hidden="true">
                    <button type="button" class="fab-menu-button fab-subaction active" id="fab-action-projects" style="--fab-delay:30ms;--item-glow:#10B981" aria-label="إظهار أو إخفاء المشروعات" aria-pressed="true" onclick="toggleMapLayer('projects')"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i><span class="fab-button-label">المشروعات <span class="fab-tooltip-state" id="fab-state-projects">نشط</span></span></button>
                    <button type="button" class="fab-menu-button fab-subaction active" id="fab-action-branches" style="--fab-delay:70ms;--item-glow:#06B6D4" aria-label="إظهار أو إخفاء الفروع" aria-pressed="true" onclick="toggleMapLayer('branches')"><i class="fa-solid fa-building" aria-hidden="true"></i><span class="fab-button-label">الفروع <span class="fab-tooltip-state" id="fab-state-branches">نشط</span></span></button>
                    <button type="button" class="fab-menu-button fab-subaction" id="fab-action-analysis" style="--fab-delay:110ms;--item-glow:#8B5CF6" aria-label="تفعيل أو تعطيل تحليل الأعمال" aria-pressed="false" onclick="toggleBusinessAnalysisMode()"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><span class="fab-button-label">تحليل الأعمال <span class="fab-tooltip-state" id="fab-state-analysis">معطل</span></span></button>
                    <button type="button" class="fab-menu-button fab-subaction" id="fab-action-warning" style="--fab-delay:150ms;--item-glow:#EF4444" aria-label="تفعيل أو تعطيل الإنذار المبكر" aria-pressed="false" onclick="toggleEarlyWarningMode()"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span class="fab-button-label">الإنذار المبكر <span class="fab-tooltip-state" id="fab-state-warning">معطل</span></span></button>
                </div>

                <div class="fab-submenu" id="control-panel-ticker" data-control-panel="ticker" aria-label="إعدادات ترتيب الشريط" aria-hidden="true">
                    <button type="button" class="fab-menu-button fab-subaction" data-ticker-criterion="projectCount" style="--fab-delay:30ms;--item-glow:#06B6D4" aria-label="ترتيب حسب عدد المشروعات" aria-pressed="true" onclick="setTickerSortCriterion('projectCount')"><i class="fa-solid fa-list-ol" aria-hidden="true"></i><span class="fab-button-label">عدد المشروعات</span></button>
                    <button type="button" class="fab-menu-button fab-subaction" data-ticker-criterion="healthScore" style="--fab-delay:65ms;--item-glow:#06B6D4" aria-label="ترتيب حسب صحة المشروعات" aria-pressed="false" onclick="setTickerSortCriterion('healthScore')"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i><span class="fab-button-label">صحة المشروعات</span></button>
                    <button type="button" class="fab-menu-button fab-subaction" data-ticker-criterion="progressAverage" style="--fab-delay:100ms;--item-glow:#06B6D4" aria-label="ترتيب حسب متوسط الإنجاز" aria-pressed="false" onclick="setTickerSortCriterion('progressAverage')"><i class="fa-solid fa-chart-line" aria-hidden="true"></i><span class="fab-button-label">متوسط الإنجاز</span></button>
                    <button type="button" class="fab-menu-button fab-subaction" data-ticker-direction="desc" style="--fab-delay:135ms;--item-glow:#8B5CF6" aria-label="ترتيب تنازلي" aria-pressed="true" onclick="setTickerSortDirection('desc')"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span class="fab-button-label">تنازلي</span></button>
                    <button type="button" class="fab-menu-button fab-subaction" data-ticker-direction="asc" style="--fab-delay:170ms;--item-glow:#8B5CF6" aria-label="ترتيب تصاعدي" aria-pressed="false" onclick="setTickerSortDirection('asc')"><i class="fa-solid fa-arrow-up-wide-short" aria-hidden="true"></i><span class="fab-button-label">تصاعدي</span></button>
                </div>

                <div class="fab-submenu" id="control-panel-settings" data-control-panel="settings" aria-label="إعدادات عرض الخريطة" aria-hidden="true">
                    <button type="button" class="fab-menu-button fab-subaction fab-pill-toggle-btn" id="theme-toggle-btn" style="--fab-delay:30ms;--item-glow:#38BDF8" aria-label="تبديل مظهر الخريطة الداكن والفاتح" onclick="toggleMapTheme()">
                        <span class="fab-pill-toggle-label">المظهر</span>
                        <div class="fab-pill-toggle-action">
                            <span class="fab-pill-toggle-state" id="fab-state-theme">Dark</span>
                            <span class="fab-pill-toggle-track" aria-hidden="true">
                                <span class="fab-pill-toggle-knob"><i class="fa-solid fa-moon" id="theme-knob-icon"></i></span>
                            </span>
                        </div>
                    </button>
                    <button type="button" class="fab-menu-button fab-subaction fab-pill-toggle-btn" id="completion-slicer-toggle" style="--fab-delay:75ms;--item-glow:#10B981" aria-label="إخفاء مشاريع إنجازها 95%" aria-pressed="false" onclick="toggleCompletionSlicerEnabled()">
                        <span class="fab-pill-toggle-label">إخفاء مشاريع إنجازها 95%</span>
                        <div class="fab-pill-toggle-action">
                            <span class="fab-pill-toggle-track" aria-hidden="true">
                                <span class="fab-pill-toggle-knob"></span>
                            </span>
                        </div>
                    </button>
                </div>

                <button type="button"
                        class="fab-main"
                        id="map-controls-trigger"
                        onclick="toggleMapControlsMenu(event)"
                        aria-label="فتح مركز التحكم بالخريطة"
                        aria-expanded="false"
                        aria-controls="fab-primary-menu"
                        title="مركز التحكم بالخريطة">
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Floating Early Warning Left Sidebar -->
    <aside id="early-warning-sidebar" class="early-warning-sidebar hidden" onclick="handleEarlyWarningSidebarClick(event)">
        <div class="ew-head">
            <div class="ew-title-box">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <div class="ew-min-hide">
                    <div class="ew-title">تقرير الإنذار المبكر والمخاطر</div>
                    <div class="ew-project-name" id="ew-project-name">اسم المشروع</div>
                </div>
            </div>
            <div class="ew-expand-btn">
                <span id="ew-mini-badge">⚠️ إنذار مبكر:</span>
                <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
            </div>
            <div class="ew-actions ew-min-hide">
                <button class="ew-full-report-btn" onclick="openFullReportFromSidebar(event)" title="فتح التقرير التفصيلي الكامل للدولة والمشروع">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>فتح التقرير كامل</span>
                </button>
                <button class="ew-btn-icon" onclick="toggleEarlyWarningSidebarMinimize(event)" title="تصغير السايد بار">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button class="ew-btn-icon" onclick="closeEarlyWarningSidebar(event)" title="إغلاق">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <div class="ew-body" id="ew-body">
            <!-- Populated dynamically by evaluateProjectEarlyWarning() -->
        </div>
    </aside>

    <!-- Country Detail Side Drawer -->
    <div id="country-drawer-overlay" class="country-drawer-overlay hidden" onclick="closeCountryDrawer(event)">
        <div class="country-drawer" id="country-drawer" onclick="event.stopPropagation()">
            <div class="country-drawer-header">
                <div class="drawer-country-title">
                    <span id="drawer-country-flag" class="drawer-flag fi"></span>
                    <div>
                        <h3 id="drawer-country-name">اسم الدولة</h3>
                        <span id="drawer-country-region" class="drawer-region-tag">الإقليم</span>
                    </div>
                </div>
                <button class="drawer-close-btn" onclick="closeCountryDrawer()" title="إغلاق النافذة">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="country-drawer-body">
                <div class="drawer-kpis-row">
                    <div class="drawer-kpi-chip">
                        <span class="chip-label">المشاريع الحية</span>
                        <span class="chip-val" id="drawer-projects-count">0</span>
                    </div>
                    <div class="drawer-kpi-chip">
                        <span class="chip-label">الفروع والمقرات</span>
                        <span class="chip-val" id="drawer-branches-count">0</span>
                    </div>
                    <div class="drawer-kpi-chip">
                        <span class="chip-label">تقارير المتابعة</span>
                        <span class="chip-val" id="drawer-reports-count">0</span>
                    </div>
                </div>
                <div class="drawer-section">
                    <h4 class="drawer-section-title"><i class="fa-solid fa-building"></i> الفروع والشركات التابعة</h4>
                    <div class="drawer-list" id="drawer-branches-list"></div>
                </div>
                <div class="drawer-section">
                    <h4 class="drawer-section-title"><i class="fa-solid fa-person-digging"></i> المشروعات الجارية</h4>
                    <div class="drawer-list" id="drawer-projects-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    
    <!-- GeoJSON boundaries (Direct memory load for 100% offline & local file reliability) -->
    <script src="mena_geojson.js"></script>

    <!-- High-Precision Geographic Coordinates Dictionary -->
    <script src="geo_coords.js?v=7.4"></script>
    
    <!-- Dedicated Performance Map Application Logic -->
    <script src="performance_map.js?v=8.12"></script>
</body>
</html>
